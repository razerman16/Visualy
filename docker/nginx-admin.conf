# Exclude query strings from logs: player URLs can contain device tokens.
log_format visualy '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log visualy;
    client_max_body_size 512m;
    # Only the fixed Caddy address is allowed to assert the original client IP.
    set_real_ip_from ${TRUSTED_PROXY_IP};
    real_ip_header X-Real-IP;
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
