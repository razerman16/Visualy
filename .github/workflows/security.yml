name: Visualy checks
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:deployment
      - run: npm run build && npm test && npm run test:security
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [api, converter, admin, player]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f docker/Dockerfile --target ${{ matrix.target }} -t visualy-scan .
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed visualy-scan
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          export SCENZLY_CHROMIUM=$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")
          sh tests/security/run-integration.sh
