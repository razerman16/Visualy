# Existing installations: run scripts/migrate-visualy.sh before starting this project.
name: visualy
x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile
  target: api
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: scenzly
      POSTGRES_USER: scenzly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Executez sh scripts/init-env.sh}
    volumes:
      - postgres18-data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scenzly -d scenzly"]
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 1g
    pids_limit: 200
    restart: unless-stopped

  migrate:
    build: *api-build
    command: [node, apps/api/dist/migrate.js]
    environment:
      DATABASE_URL: postgresql://scenzly:${POSTGRES_PASSWORD:?Executez sh scripts/init-env.sh}@postgres:5432/scenzly
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Executez sh scripts/init-env.sh}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    restart: "no"

  api:
    build: *api-build
    environment:
      DATABASE_URL: postgresql://screnzly_app:${APP_DB_PASSWORD:?Executez sh scripts/init-env.sh}@postgres:5432/scenzly
      HOST: 0.0.0.0
      PORT: 3000
      MEDIA_DIR: /data/media
      CONVERTER_URL: http://converter:3001
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:?Executez sh scripts/init-env.sh}
      SETUP_TOKEN: ${SETUP_TOKEN:?Executez sh scripts/init-env.sh}
      COOKIE_SECURE: "false"
      MEDIA_QUOTA_MB: ${MEDIA_QUOTA_MB:-10240}
      NODE_ENV: production
    volumes:
      - media-data:/data/media
    networks: [database, backend, conversion]
    depends_on:
      migrate:
        condition: service_completed_successfully
      converter:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    mem_limit: 768m
    cpus: 2
    pids_limit: 100
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true

  converter:
    build:
      <<: *api-build
      target: converter
    environment:
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:?Executez sh scripts/init-env.sh}
    networks: [conversion]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777", "/data/work:size=768m,uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    init: true

  admin-web:
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-8080}:80"
    build:
      <<: *api-build
      target: admin
    environment:
      TRUSTED_PROXY_IP: 127.0.0.1
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  player-web:
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PLAYER_PORT:-8081}:80"
    build:
      <<: *api-build
      target: player
    environment:
      TRUSTED_PROXY_IP: 127.0.0.1
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    restart: unless-stopped


networks:
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-172.30.240.0/24}
          ip_range: ${FRONTEND_DYNAMIC_RANGE:-172.30.240.128/25}
  backend:
    internal: true
  database:
    internal: true
  conversion:
    internal: true
volumes:
  postgres18-data:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_postgres18-data
  media-data:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_media-data
  caddy-data:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_caddy-data
  caddy-config:
    name: ${VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_caddy-config
