name: scenzly
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: scenzly
      POSTGRES_USER: scenzly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Executez sh scripts/init-env.sh pour creer .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scenzly -d scenzly"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://scenzly:${POSTGRES_PASSWORD:?Executez sh scripts/init-env.sh}@postgres:5432/scenzly
      HOST: 0.0.0.0
      PORT: 3000
      MEDIA_DIR: /data/media
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    init: true

  admin-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: admin
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  player-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: player
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PLAYER_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
