# Optional LAN HTTPS. Requires Docker Compose >= 2.24.4 for !reset.
# docker compose -f compose.yaml -f compose.https.yaml up -d --build --wait
services:
  api:
    environment:
      COOKIE_SECURE: "true"
  admin-web:
    ports: !reset []
  player-web:
    ports: !reset []
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${BIND_ADDRESS:-0.0.0.0}:443:443"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.scenzly.home.arpa}
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:-player.scenzly.home.arpa}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      admin-web:
        condition: service_healthy
      player-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
